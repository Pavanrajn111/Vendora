{% extends "base.html" %}
{% block title %}Vendora | {{ code }} Error{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center fade-in">
    <div class="glass-card p-12 max-w-lg w-full border border-glass">
        <div class="w-20 h-20 rounded-2xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center text-4xl text-orange-400 mx-auto mb-6">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 class="text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-400 to-orange-500 mb-4">{{ code }}</h1>
        <p class="text-muted text-lg mb-8">{{ message }}</p>
        <div class="flex justify-center gap-4">
            {% if session.get('user') %}
            <a href="{{ url_for('dashboard') }}" class="btn-glow px-6 py-3 rounded-xl font-medium">
                <i class="fa-solid fa-house mr-2"></i>Go to Dashboard
            </a>
            {% else %}
            <a href="{{ url_for('index') }}" class="btn-glow px-6 py-3 rounded-xl font-medium">
                <i class="fa-solid fa-house mr-2"></i>Go to Home
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
